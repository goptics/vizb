name: CLI

on:
  workflow_call:
  push:
    branches: [main]
    paths:
      - '**.go'
      - go.mod
      - go.sum
      - .goreleaser.yml
      - action.yml
      - action/**
      - .github/workflows/action-ci.yml
      - .github/workflows/cli.yml
      - .github/actions/setup-embed-ui/**
  pull_request:
    branches: [main]
    paths:
      - '**.go'
      - 'ui/**'
      - go.mod
      - go.sum
      - .goreleaser.yml
      - action.yml
      - action/**
      - .github/workflows/action-ci.yml
      - .github/workflows/cli.yml
      - .github/actions/setup-embed-ui/**

permissions:
  contents: read
  actions: write

jobs:
  embed:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-slim
    concurrency:
      group: embed-ui-${{ github.sha }}
      queue: max
    steps:
      - uses: actions/checkout@v7

      - name: Rebuild embed for PR
        uses: ./.github/actions/setup-embed-ui

  # Feature branches must not land gen churn; main is owned by sync-embed-ui.
  forbid-gen-commit:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-slim
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Reject pkg/template/vizb-ui.gen.go in PR diffs
        run: |
          set -euo pipefail
          base="${{ github.event.pull_request.base.sha }}"
          head="${{ github.event.pull_request.head.sha }}"
          if git diff --name-only "$base"..."$head" | grep -qx 'pkg/template/vizb-ui.gen.go'; then
            echo "error: do not commit pkg/template/vizb-ui.gen.go"
            echo "  The tracked snapshot on main is updated by .github/workflows/sync-embed-ui.yml (#319)."
            echo "  Unstage with: git restore --staged pkg/template/vizb-ui.gen.go"
            echo "  Discard local rewrite: git restore pkg/template/vizb-ui.gen.go"
            exit 1
          fi
          echo "OK: gen file not modified in this PR"

  lint:
    needs: [embed]
    if: ${{ !cancelled() && (needs.embed.result == 'success' || needs.embed.result == 'skipped') }}
    runs-on: ubuntu-slim
    steps:
      - uses: actions/checkout@v7

      # PRs: ephemeral re-embed so CLI tests see unmerged ui/ changes.
      # main / release (workflow_call): use tracked gen (sync-embed-ui keeps main current).
      - name: Rebuild embed for PR
        if: github.event_name == 'pull_request'
        uses: ./.github/actions/setup-embed-ui

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12

  format:
    runs-on: ubuntu-slim
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Check gofmt
        run: |
          unformatted=$(gofmt -l $(find . -name '*.go' \
            -not -path './pkg/template/vizb-ui.gen.go' \
            -not -path './.git/*'))
          if [ -n "$unformatted" ]; then
            echo "$unformatted"
            exit 1
          fi

  test:
    needs: [embed]
    if: ${{ !cancelled() && (needs.embed.result == 'success' || needs.embed.result == 'skipped') }}
    runs-on: ubuntu-slim
    steps:
      - uses: actions/checkout@v7

      - name: Rebuild embed for PR
        if: github.event_name == 'pull_request'
        uses: ./.github/actions/setup-embed-ui

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - run: go mod download

      - run: go test -count=1 -coverpkg=./... -coverprofile=coverage.txt -covermode=atomic ./...

      - uses: codecov/codecov-action@v7
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
        with:
          files: ./coverage.txt
          flags: cli
          name: cli

  action:
    needs: [lint, format, test]
    uses: ./.github/workflows/action-ci.yml
