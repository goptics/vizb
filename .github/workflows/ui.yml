name: UI

on:
  workflow_call:
  push:
    branches: [main]
    paths:
      - "ui/**"
      - ".github/actions/setup-js/**"
      - ".github/workflows/ui.yml"
  pull_request:
    branches: [main]
    paths:
      - "ui/**"
      - ".github/actions/setup-js/**"
      - ".github/workflows/ui.yml"

jobs:
  lint:
    runs-on: ubuntu-slim
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node and pnpm
        uses: ./.github/actions/setup-js
        with:
          cache-dependency-path: ui/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      - run: pnpm typecheck

  format:
    runs-on: ubuntu-slim
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node and pnpm
        uses: ./.github/actions/setup-js
        with:
          cache-dependency-path: ui/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      - run: pnpm format:check

  test:
    runs-on: ubuntu-slim
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node and pnpm
        uses: ./.github/actions/setup-js
        with:
          cache-dependency-path: ui/pnpm-lock.yaml

      # Install must not run under NODE_ENV=production or pnpm omits devDeps
      # (vitest, coverage, …). Pin production only for the test run so Vue
      # uses the production build and listener-spy emit checks stay valid.
      - run: pnpm install --frozen-lockfile

      - run: pnpm test:coverage
        env:
          NODE_ENV: production

      - uses: codecov/codecov-action@v7
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
        with:
          files: ./ui/coverage/lcov.info
          flags: ui
          name: ui

  e2e:
    runs-on: ubuntu-slim
    permissions:
      contents: read
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Node and pnpm
        uses: ./.github/actions/setup-js
        with:
          cache-dependency-path: ui/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      - run: pnpm exec playwright install --with-deps chromium

      - run: pnpm test:e2e

  build:
    needs: [lint, format, test, e2e]
    runs-on: ubuntu-slim
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node and pnpm
        uses: ./.github/actions/setup-js
        with:
          cache-dependency-path: ui/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile
        working-directory: ui

      # Smoke: prove embed generation still works. Tracked gen on main is
      # updated by sync-embed-ui.yml after ui/ merges; PRs must not commit gen.
      - run: pnpm build:embed
        working-directory: ui
