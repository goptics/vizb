name: Vizb Action
description: Turn CSV/JSON tabular data or benchmark output (Go, Rust, JavaScript) into interactive HTML visualizations with vizb
author: fahimfaisaal
branding:
  icon: 'bar-chart-2'
  color: 'blue'

inputs:
  cmd:
    description: "Command whose stdout is visualized — any command emitting CSV/JSON tabular data or benchmark output (e.g., go test -bench=., cargo bench, cat data.csv)."
    default: ""
  cmd-retries:
    description: "Total attempts for cmd. 1 = no retry (default). Integer >= 1. Failed attempts wait 2s, then double."
    default: "1"
  file:
    description: "Path to an existing input file to visualize — benchmark output, CSV, or JSON (takes priority over cmd)"
    default: ""
  bench-cmd:
    description: "DEPRECATED: use 'cmd'. Command to run; honored only when 'cmd' is empty." # remove on v1
    default: ""
  bench-file:
    description: "DEPRECATED: use 'file'. Existing input file; honored only when 'file' is empty." # remove on v1
    default: ""
  name:
    description: "Dataset/benchmark name (-n flag)"
    default: "Comparisons"
  title:
    description: "Override the chart title when --col-axis produces one chart; independent of -n/--name, otherwise ignored (--title flag)"
    default: ""
  description:
    description: "Dataset/benchmark description (-d flag)"
    default: ""
  tag:
    description: "Tag/identifier for the dataset (-t flag)"
    default: ""
  id:
    description: "Dataset id for ?id= deep links (--id flag)"
    default: ""
  group:
    description: "Column/field names merged into the group name; forwarded as -g (accepts space- or comma-separated, e.g. 'name category region' or 'name,category/region'); parsed by -p/-r. Omit for csv/json to let vizb auto-group the most-unique categorical column onto the X axis"
    default: ""
  group-pattern:
    description: "Group pattern (-p flag)"
    default: "x"
  group-regex:
    description: "Group regex (-r flag)"
    default: ""
  sort:
    description: "DEPRECATED: use 'chart' input instead (e.g. chart: 'bar:sort=asc'). Sort order: asc or desc (-s flag)"
    default: ""
  filter:
    description: "Regex to include only matching rows (CSV/JSON: --group label) or benchmark names (-f flag)"
    default: ""
  mem-unit:
    description: "Memory unit: b, B, KB, MB, GB (-M flag)"
    default: B
  time-unit:
    description: "Time unit: ns, us, ms, s (-T flag)"
    default: ns
  number-unit:
    description: "Number unit: K, M, B, T (-N flag)"
    default: ""
  round:
    description: "Round numeric values to 2 decimal places in the output data (--round flag). Off by default."
    default: "false"
  select:
    description: "csv/json only: select value columns; optional rename with {label} (e.g. 'price{Unit price},count') (--select flag)"
    default: ""
  col-axis:
    description: "csv/json + group: place numeric column names on this axis (n, x, y, or z) so all columns share one chart (--col-axis / -A flag). Requires group; target axis must not already be used by group-pattern."
    default: ""
  json-path:
    description: "json only: select a nested array to chart via a jq-like dot path (e.g. '.data.results') (--json-path flag)"
    default: ""
  stat:
    description: "Enable stats panel (--stat flag). Empty = disabled; 'all' or 'true' = all categories; otherwise comma-separated from: counts, center, spread, extremes, shape, percentiles, confidence, correlations"
    default: ""
  chart:
    description: "Per-chart overrides (--chart flag, repeatable). One override per line: '<type>:<key>=<val>,...'. Keys: swap, sort, scale, stack, labels, 3d-rotate, 3d, symbol, symbol-size, smooth, horizontal, border-radius, bg, stat. Object props use {field=value;field=value} (semicolons inside braces; commas stay literal). E.g. 'bar:scale=log', 'line:scale={type=log;axes=x}', 'pie:labels', 'bar:bg', or 'bar:bg={color=rgba(180, 180, 180, 0.2);borderColor=#000}'. Blank lines and #-prefixed lines are ignored."
    default: ""
  charts:
    description: "Chart types to generate (-c flag): bar, line, scatter, pie, heatmap, radar, sankey, chord"
    default: ""
  parser:
    description: "Parser to use: csv, json, go, js:tinybench, js:vitest, rs:criterion, rs:divan (-P flag)"
    default: "auto"
  show-labels:
    description: "DEPRECATED: use 'chart' input instead (e.g. chart: 'pie:labels'). Show labels on charts (-l flag)"
    default: "false"
  enable-3d:
    description: "Bundle the 3D renderer for vizb ui (--3d flag, mainly useful with data-url when remote data shape is unknown at build time)"
    default: "false"
  merge-files:
    description: "Space-separated JSON files to merge"
    default: ""
  merge-dir:
    description: "Directory to scan for JSON files to merge"
    default: ""
  tag-axis:
    description: "Tag injection axis: n, x, y, or z (-A flag)"
    default: n
  output-json:
    description: "Path for JSON output file (leave empty to skip JSON generation)"
    default: ""
  output-html:
    description: "Path for HTML output file (leave empty to skip HTML generation)"
    default: ""
  data-url:
    description: "URL to fetch vizb JSON from at runtime (-U flag). Accepts full dataset payloads or a lazy [{id,name}] catalog with details at /dataset/<encoded-id>."
    default: ""
  vizb-binary:
    description: "Path to a pre-built vizb binary on the runner. When set, skips version resolution, cache, and release download and installs this binary instead — useful for testing local builds or unreleased changes."
    default: ""
outputs:
  output-file-html:
    description: Path to HTML output file
    value: ${{ inputs.output-html }}
  output-file-json:
    description: Path to JSON output file
    value: ${{ inputs.output-json }}

runs:
  using: composite
  steps:
    - name: Resolve vizb version
      if: inputs.vizb-binary == ''
      id: version
      shell: bash
      run: bash "$GITHUB_ACTION_PATH/action/resolve.sh"

    - name: Cache vizb binary
      if: inputs.vizb-binary == ''
      id: cache-vizb
      uses: actions/cache@v6
      with:
        path: |
          ~/.local/bin/vizb
          ~/.local/bin/vizb.exe
        key: vizb-${{ steps.version.outputs.tag }}-${{ runner.os }}-${{ runner.arch }}

    - name: Install vizb
      if: inputs.vizb-binary != '' || steps.cache-vizb.outputs.cache-hit != 'true'
      shell: bash
      env:
        VIZB_BINARY: ${{ inputs.vizb-binary }}
        VIZB_TAG: ${{ steps.version.outputs.tag }}
      run: bash "$GITHUB_ACTION_PATH/action/install.sh"

    - name: Add vizb to PATH
      shell: bash
      run: echo "$HOME/.local/bin" >> "$GITHUB_PATH"

    - name: Run vizb pipeline
      shell: bash
      env:
        VIZB_ACTION_INPUTS: ${{ toJSON(inputs) }}
      run: node "$GITHUB_ACTION_PATH/action/run.mjs"
